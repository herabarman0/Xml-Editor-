<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XML Live Preview Pro — HeraSoft</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b0d14; --panel: #13172a; --panel2: #1a1f3a; --panel3: #22284a;
            --border: #2c3250; --border-light: #3a4166; --text: #e8ecf9; --text-secondary: #99a0c9;
            --muted: #6a7199; --accent: #3ddc84; --accent-dim: #2a9d5f; --accent-glow: rgba(61,220,132,.15);
            --error: #ff5d7a; --error-bg: #2b1420; --warn: #ffb454; --warn-bg: #2b2114;
            --radius: 10px; --radius-sm: 6px; --shadow: 0 12px 40px rgba(0,0,0,.6);
            --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
        body { display: flex; flex-direction: column; height: 100vh; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

        header {
            padding: 10px 20px; border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #13182a, #0b0d14); flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
        }
        header .brand { display: flex; align-items: center; gap: 10px; }
        header .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); flex-shrink: 0; }
        header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; background: linear-gradient(135deg,#fff,#a0b4e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        header .badge { font-size: 10px; background: var(--accent-dim); color: #04140a; padding: 2px 12px; border-radius: 20px; font-weight: 600; -webkit-text-fill-color: #04140a; }
        header .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        header .actions .shortcut-hint { font-size: 10px; color: var(--muted); background: var(--panel2); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }

        .toolbar { display: flex; gap: 6px; padding: 6px 16px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
        .toolbar select, .toolbar button {
            background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 5px 10px; font-size: 12px; font-family: var(--font-sans); cursor: pointer; transition: all .15s;
            display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
        }
        .toolbar select:hover, .toolbar button:hover { border-color: var(--accent-dim); background: var(--panel3); }
        .toolbar button.primary { border-color: var(--accent-dim); color: var(--accent); }
        .toolbar button.primary:hover { background: var(--accent-dim); color: #04140a; }
        .toolbar button.danger { color: var(--error); border-color: #5d2a3a; }
        .toolbar button.danger:hover { background: var(--error-bg); border-color: var(--error); }
        .toolbar .sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

        .workspace { display: flex; flex: 1; min-height: 0; gap: 0; position: relative; }
        @media (max-width: 899px) { .workspace { flex-direction: column; } }
        /* "ওয়াইড ভিউ" বাটনে চাপলে — normal mobile viewport-এই পাশাপাশি
           লেআউট জোর করে দেখায়, ব্রাউজারের "Desktop site" মোডের দরকার
           পড়ে না, তাই সেই মোডের অটো-জুম সমস্যাও হয় না। */
        .workspace.force-wide { flex-direction: row !important; }
        .workspace.force-wide .resize-handle { width: 6px !important; height: auto !important; cursor: col-resize !important; }
        .workspace.force-wide .resize-handle::after { transform: translate(-50%, -50%) !important; }

        .resize-handle {
            width: 6px; background: var(--border); cursor: col-resize; flex-shrink: 0; transition: background .2s; position: relative; z-index: 10;
            touch-action: none;
        }
        .resize-handle:hover, .resize-handle.active { background: var(--accent-dim); }
        .resize-handle::after { content: '⋮'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: 14px; opacity: .5; }
        @media (max-width: 899px) {
            .resize-handle { width: 100%; height: 6px; cursor: row-resize; }
            .resize-handle::after { transform: translate(-50%,-50%) rotate(90deg); }
        }

        .editor-pane { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: var(--bg); position: relative; overflow: hidden; }
        .editor-pane .pane-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .editor-pane .pane-header .label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
        .editor-pane .pane-header .info { font-size: 10px; color: var(--text-secondary); font-family: var(--font-mono); }

        .editor-wrap { display: flex; flex: 1; min-height: 0; position: relative; overflow: hidden; }

        .CodeMirror {
            height: 100% !important; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
            padding-top: 10px; background: #080a12 !important; color: #dbe2ff;
        }
        .CodeMirror-gutters { background: #080a12 !important; border-right: 1px solid var(--border) !important; min-width: 36px; }
        .CodeMirror-lines { background-image: repeating-linear-gradient(to right, transparent, transparent 23px, rgba(255,255,255,0.09) 23px, rgba(255,255,255,0.09) 24px); padding-bottom: 40px; }
        .CodeMirror-activeline-background { background: rgba(61,220,132,0.05); }
        .CodeMirror-matchingbracket { color: #fff !important; background: var(--accent-dim); outline: 1px solid var(--accent-dim); }

        /* Custom hint dropdown styling to match theme */
        .CodeMirror-hints {
            font-family: var(--font-mono); font-size: 12px; background: #161b30 !important;
            border: 1px solid var(--border-light) !important; box-shadow: var(--shadow);
            border-radius: 6px; padding: 4px 0; z-index: 999;
        }
        .CodeMirror-hint { color: #cdd6f4 !important; padding: 4px 12px !important; }
        li.CodeMirror-hint-active { background: var(--accent-dim) !important; color: #04140a !important; }

        #xmlInput { display: none; }
        /* মোবাইল ব্রাউজারে (ডেক্সটপ মোড সহ) কোডে ক্লিক করলেই অটো-জুম হয়ে
           যাওয়ার আসল কারণ: CodeMirror-এর আসল <textarea>-টার ফন্ট-সাইজ
           16px-এর কম হলে Chrome/Safari নিজে থেকেই জুম করে ফেলে। এখানে
           শুধু ওই লুকানো textarea-র ফন্ট-সাইজ 16px করে দিলাম — দৃশ্যমান
           কোডের ফন্ট-সাইজ একই থাকবে, শুধু ক্লিক করলে আর জুম হবে না। */
        .CodeMirror textarea {
            font-size: 16px !important;
        }

        .preview-pane { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: var(--bg); }
        .preview-pane .pane-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .preview-pane .pane-header .label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
        .preview-pane .pane-header .info { font-size: 10px; color: var(--text-secondary); }

        .preview-scroll {
            flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
            padding: 16px 12px 24px; background: radial-gradient(ellipse at 50% 20%, #141a30, #080a14 80%);
        }
        .phone-frame {
            width: 360px; min-width: 260px; max-width: 100%; border-radius: 32px; background: #05060a; padding: 10px;
            box-shadow: 0 12px 40px rgba(0,0,0,.7), inset 0 0 0 1px var(--border); height: fit-content; flex-shrink: 0;
            transition: width .25s ease, transform .2s ease; transform-origin: top center;
        }
        .phone-statusbar {
            height: 22px; background: #000; border-radius: 16px 16px 0 0; display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px; font-size: 9px; color: #8fffb0; font-family: var(--font-mono); font-weight: 500;
        }
        #previewRoot {
            background: #ffffff; color: #1a1a1a; min-height: 480px; max-height: 560px; overflow: auto;
            border-radius: 0 0 16px 16px; font-family: 'Roboto', 'Inter', system-ui, sans-serif; position: relative;
        }
        #previewRoot::-webkit-scrollbar { width: 4px; }
        #previewRoot::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        #previewRoot .empty-state { padding: 48px 20px; color: #aaa; font-size: 13px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #previewRoot .empty-state .icon { font-size: 28px; opacity: .3; }

        .status-area { border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
        .status-bar { padding: 6px 16px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 10px; font-family: var(--font-sans); min-height: 34px; }
        .status-bar.ok { color: var(--accent); }
        .status-bar.error { color: var(--error); background: var(--error-bg); }
        .status-bar .status-icon { font-size: 14px; }
        .status-bar .status-msg { flex: 1; }
        .status-bar .status-meta { font-size: 10px; color: var(--muted); font-weight: 400; }
        .error-detail { padding: 4px 16px 10px; font-size: 12px; color: #ff9caf; font-family: var(--font-mono); white-space: pre-wrap; word-break: break-word; background: var(--error-bg); border-top: 1px solid #3d1a28; display: none; }
        .error-detail.visible { display: block; }
        .warn-list { padding: 4px 16px 10px; background: var(--warn-bg); border-top: 1px solid #3d2a14; display: none; }
        .warn-list.visible { display: block; }
        .warn-item { font-size: 12px; color: var(--warn); padding: 3px 0 3px 12px; border-left: 2px solid var(--warn); margin-top: 3px; font-family: var(--font-mono); }

        .workspace.fullscreen .editor-pane { flex: 1; }
        .workspace.fullscreen .preview-pane { display: none; }
        .workspace.fullscreen .resize-handle { display: none; }

        .av-textview, .av-button, .av-edittext { font-size: 14px; }
        .av-button {
            background: #3ddc84; color: #04140a; border-radius: 4px; text-align: center; font-weight: 600;
            text-transform: uppercase; padding: 10px 16px; display: inline-flex; align-items: center;
            justify-content: center; border: none; cursor: default; min-height: 36px;
        }
        .av-edittext { border-bottom: 1.5px solid #9e9e9e; padding: 8px 4px; color: #444; background: transparent; min-height: 32px; }
        .av-imageview {
            background: repeating-linear-gradient(45deg,#e8e8e8,#e8e8e8 6px,#f2f2f2 6px,#f2f2f2 12px);
            display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px;
            min-height: 60px; min-width: 60px; border-radius: 2px;
        }
        .av-checkbox, .av-radiobutton, .av-switch { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
        .av-checkbox input, .av-radiobutton input, .av-switch input { accent-color: #3ddc84; width: 18px; height: 18px; cursor: default; }
        .av-progressbar { height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; position: relative; min-height: 4px; }
        .av-progressbar::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 40%; background: #3ddc84;
            animation: av-load 1.4s infinite ease-in-out; border-radius: 2px;
        }
        @keyframes av-load { 0% { left: -40%; width: 30%; } 50% { width: 60%; } 100% { left: 100%; width: 30%; } }
        .av-seekbar { height: 4px; background: #e0e0e0; border-radius: 2px; position: relative; min-height: 4px; }
        .av-seekbar::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: #3ddc84; border-radius: 2px; }
        .av-seekbar::before { content: '●'; position: absolute; left: 28%; top: 50%; transform: translate(-50%,-50%); font-size: 14px; color: #3ddc84; }
        .av-id-tag {
            position: absolute; top: -1px; left: -1px; font-size: 7px; background: #3ddc84; color: #04140a;
            padding: 0 5px; border-radius: 0 0 4px 0; font-family: var(--font-mono); opacity: .8; z-index: 5; font-weight: 600; pointer-events: none;
        }
        .av-unknown { border: 1px dashed #cc4b4b; color: #cc4b4b; font-size: 10px; padding: 8px; background: rgba(204,75,75,.06); border-radius: 4px; }
        .av-linearlayout, .av-relative-layout, .av-framelayout, .av-constraintlayout { display: flex; flex-wrap: wrap; width: 100%; }
        .av-linearlayout { flex-direction: column; }
        .av-linearlayout[data-orientation="horizontal"] { flex-direction: row; }
        .av-relative-layout, .av-framelayout, .av-constraintlayout { flex-direction: column; gap: 6px; position: relative; }
        .av-cardview { border-radius: 8px; padding: 12px; background: #fafafa; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

        /* ── Material 3 / AppCompat widget styles ── */
        .av-materialbutton, .av-appcompatbutton {
            background: #6750A4; color: #fff; border-radius: 20px; text-align: center; font-weight: 600;
            font-size: 14px; padding: 10px 24px; display: inline-flex; align-items: center; justify-content: center;
            min-height: 40px; gap: 6px; border: none; text-transform: none;
        }
        .av-materialbutton[data-style="outlined"] { background: transparent; color: #6750A4; border: 1px solid #79747E; }
        .av-materialbutton[data-style="text"] { background: transparent; color: #6750A4; padding: 10px 12px; }
        .av-materialbutton[data-style="tonal"] { background: #E8DEF8; color: #1D192B; }
        .av-materialcardview {
            border-radius: 12px; padding: 16px; background: #FFFBFE; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
        }
        .av-materialcardview[data-stroked="1"] { box-shadow: none; border: 1px solid #CAC4D0; }
        .av-textinputlayout {
            border: 1px solid #79747E; border-radius: 4px; padding: 14px 12px 6px; position: relative;
            background: transparent; min-height: 52px;
        }
        .av-textinputlayout .til-label { position: absolute; top: -8px; left: 10px; background: #FFFBFE; padding: 0 4px; font-size: 10px; color: #6750A4; }
        .av-textinputedittext, .av-autocompletetextview, .av-appcompatautocompletetextview {
            border: none; border-bottom: 1.5px solid transparent; padding: 4px 0; color: #1D1B20; background: transparent; min-height: 24px; font-size: 14px;
        }
        .av-chip {
            display: inline-flex; align-items: center; gap: 6px; background: #E8DEF8; color: #1D192B;
            border-radius: 8px; padding: 6px 14px; font-size: 13px; min-height: 32px;
        }
        .av-chipgroup { display: flex; flex-wrap: wrap; gap: 8px; }
        .av-floatingactionbutton {
            width: 56px; height: 56px; border-radius: 16px; background: #6750A4; color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            box-shadow: 0 4px 8px rgba(0,0,0,.2); flex-shrink: 0;
        }
        .av-extendedfloatingactionbutton {
            height: 56px; border-radius: 16px; background: #6750A4; color: #fff; padding: 0 20px;
            display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
            box-shadow: 0 4px 8px rgba(0,0,0,.2);
        }
        .av-materialtoolbar, .av-toolbar {
            height: 56px; background: #F7F2FA; display: flex; align-items: center; padding: 0 12px; gap: 12px;
            font-size: 17px; font-weight: 600; color: #1D1B20; width: 100%;
        }
        .av-bottomappbar { height: 56px; background: #F7F2FA; display: flex; align-items: center; padding: 0 12px; gap: 16px; width: 100%; }
        .av-bottomnavigationview {
            height: 64px; background: #FFFBFE; display: flex; align-items: center; justify-content: space-around;
            width: 100%; box-shadow: 0 -1px 4px rgba(0,0,0,.08); font-size: 10px; color: #49454F;
        }
        .av-navigationrailview {
            width: 80px; background: #FFFBFE; display: flex; flex-direction: column; align-items: center;
            padding: 12px 0; gap: 16px; font-size: 10px; color: #49454F; height: 100%;
        }
        .av-navigationview {
            width: 100%; background: #FFFBFE; padding: 16px; display: flex; flex-direction: column; gap: 4px;
        }
        .av-tablayout { display: flex; background: #FFFBFE; border-bottom: 1px solid #CAC4D0; width: 100%; }
        .av-tabitem { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #6750A4; border-bottom: 2px solid #6750A4; }
        .av-materialdivider, .av-divider { width: 100%; height: 1px; background: #CAC4D0; }
        .av-switchmaterial, .av-switchcompat { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
        .av-switchmaterial input, .av-switchcompat input { accent-color: #6750A4; width: 36px; height: 20px; cursor: default; }
        .av-materialcheckbox input, .av-appcompatcheckbox input,
        .av-materialradiobutton input, .av-appcompatradiobutton input { accent-color: #6750A4; width: 18px; height: 18px; }
        .av-linearprogressindicator { height: 4px; background: #E8DEF8; border-radius: 2px; overflow: hidden; position: relative; min-height: 4px; }
        .av-linearprogressindicator::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 40%; background: #6750A4;
            animation: av-load 1.4s infinite ease-in-out; border-radius: 2px;
        }
        .av-circularprogressindicator {
            width: 36px; height: 36px; border-radius: 50%; border: 3px solid #E8DEF8; border-top-color: #6750A4;
            animation: av-spin 0.9s linear infinite;
        }
        @keyframes av-spin { to { transform: rotate(360deg); } }
        .av-slider, .av-rangeslider { height: 4px; background: #E8DEF8; border-radius: 2px; position: relative; min-height: 4px; }
        .av-slider::after, .av-rangeslider::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 40%; background: #6750A4; border-radius: 2px; }
        .av-slider::before, .av-rangeslider::before { content: '●'; position: absolute; left: 38%; top: 50%; transform: translate(-50%,-50%); font-size: 16px; color: #6750A4; }
        .av-shapeableimageview { background: repeating-linear-gradient(45deg,#e8e8e8,#e8e8e8 6px,#f2f2f2 6px,#f2f2f2 12px); display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px; min-height: 60px; min-width: 60px; }
        .av-appbarlayout { width: 100%; background: #F7F2FA; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
        .av-collapsingtoolbarlayout { width: 100%; background: #6750A4; color: #fff; min-height: 120px; display: flex; align-items: flex-end; padding: 16px; font-weight: 700; }
        .av-coordinatorlayout { position: relative; width: 100%; }
        .av-appcompatspinner {
            border-bottom: 1.5px solid #79747E; padding: 8px 4px; color: #444; background: transparent; min-height: 32px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .av-appcompatspinner::after { content: '▾'; color: #6750A4; }

        @media (max-width: 600px) {
            header h1 { font-size: 15px; }
            .phone-statusbar { font-size: 8px; padding: 0 10px; height: 18px; }
            .toolbar { padding: 4px 8px; gap: 4px; }
            .toolbar select, .toolbar button { font-size: 11px; padding: 4px 8px; }
            .CodeMirror { font-size: 11px; padding: 6px 10px 30px; }
            .status-bar { font-size: 11px; padding: 4px 12px; }
        }
        @media (max-width: 400px) {
            header .badge { display: none; }
        }

        .fullscreen-btn {
            background: none; border: 1px solid var(--border); color: var(--text-secondary); border-radius: var(--radius-sm);
            padding: 4px 8px; font-size: 14px; cursor: pointer; transition: all .15s; line-height: 1;
        }
        .fullscreen-btn:hover { background: var(--panel3); border-color: var(--accent-dim); color: var(--accent); }

        /* ── Resources panel overlay ── */
        .res-overlay {
            display: none; position: fixed; inset: 0; background: rgba(5,6,10,.72); z-index: 200;
            align-items: center; justify-content: center; padding: 16px;
        }

    <script>
        (function() {
            'use strict';

            const previewRoot = document.getElementById('previewRoot');

            const resBtn = document.getElementById('resBtn');

            const resCloseBtn = document.getElementById('resCloseBtn');
            const resApplyBtn = document.getElementById('resApplyBtn');
            const resStatus = document.getElementById('resStatus');

            // ═══════════════════════════════════════════════
            // XML ইনডেন্ট হিসাব — ট্যাগ নেস্টিং গণনা করে সঠিক
            // ইনডেন্ট বের করে, CodeMirror-এর ডিফল্ট bracket-
            // alignment (যেটা কার্সরকে মাঝখানে নিয়ে যাচ্ছিল) ব্যবহার
            // না করে। প্রতিটা attribute সবসময় ট্যাগের ৪-স্পেস
            // নিচে সোজা লাইনে বসবে — Android Studio-র মতো।
            // ═══════════════════════════════════════════════
            function computeXmlIndent(cm, cursorLine, cursorCh) {
                const fullText = cm.getRange({ line: 0, ch: 0 }, { line: cursorLine, ch: cursorCh });
                let depth = 0;
                let inTag = false;
                let tagIsClosing = false;
                let inQuote = null;
                for (let i = 0; i < fullText.length; i++) {
                    const c = fullText[i];
                    if (inQuote) {
                        if (c === inQuote) inQuote = null;
                        continue;
                    }
                    if (c === '"' || c === "'") { inQuote = c; continue; }
                    if (!inTag) {
                        if (c === '<') {
                            if (fullText.slice(i, i + 4) === '<!--') {
                                const end = fullText.indexOf('-->', i);
                                if (end === -1) { break; }
                                i = end + 2;
                                continue;
                            }
                            inTag = true;
                            tagIsClosing = fullText[i + 1] === '/';
                        }
                    } else {
                        if (c === '>') {
                            const selfClose = fullText[i - 1] === '/';
                            if (tagIsClosing) depth = Math.max(0, depth - 1);
                            else if (!selfClose) depth++;
                            inTag = false;
                        }
                    }
                }
                // কার্সর যদি এখনো একটা ওপেন ট্যাগের attribute অংশে থাকে
                // (যেমন <Button লেখার পর এখনো '>' আসেনি), তাহলে
                // attribute-গুলো ট্যাগের চেয়ে ১ ধাপ (৪ স্পেস) গভীরে বসবে।
                if (inTag && !tagIsClosing) return depth * 4 + 4;
                return depth * 4;
            }

            // ─── Initialize CodeMirror ──────────────────────
            const editor = CodeMirror.fromTextArea(document.getElementById('xmlInput'), {
                mode: 'xml',
                theme: 'dracula',
                lineNumbers: true,
                lineWrapping: false,
                styleActiveLine: true,
                matchBrackets: true,
                autoCloseTags: { whenClosing: true, whenOpening: true, indentTags: [] },
                autoCloseBrackets: "()[]\"\"''",
                indentUnit: 4,
                tabSize: 4,
                extraKeys: {
                    "Ctrl-Space": "autocomplete",
                    "Tab": function(cm) {
                        if (cm.somethingSelected()) cm.indentSelection("add");
                        else cm.replaceSelection("    ", "end");
                    },
                    "Enter": function(cm) {
                        const cur = cm.getCursor();
                        const indent = computeXmlIndent(cm, cur.line, cur.ch);
                        cm.replaceSelection('\n' + ' '.repeat(indent));
                    },
                    "Backspace": function(cm) {
                        if (cm.somethingSelected()) { cm.replaceSelection(''); return; }
                        const cur = cm.getCursor();
                        const line = cm.getLine(cur.line);
                        const before = line.slice(0, cur.ch);
                        // কার্সরের আগে যদি শুধুই স্পেস থাকে, তাহলে ৪-স্পেস
                        // ব্লকে (ইনডেন্ট ইউনিট) ডিলিট করবে — একটার পর একটা
                        // স্পেস নয়, যাতে লাইন বরাবর সোজা ইনডেন্ট বজায় থাকে।
                        if (before.length > 0 && /^\s+$/.test(before)) {
                            const rem = before.length % 4 || 4;
                            cm.replaceRange('', CodeMirror.Pos(cur.line, cur.ch - rem), cur);
                        } else {
                            cm.execCommand('delCharBefore');
                        }
                    }
                },
                hintOptions: { completeSingle: false }
            });

            const getVal = () => editor.getValue();
            const setVal = (v) => editor.setValue(v);

            let warnings = [];
            let renderTimer = null;
            let resizeActive = false;
            let currentDir = 'ltr';

            // ═══════════════════════════════════════════════

            // ═══════════════════════════════════════════════

            const DEFAULT_RES = `<project-resources xmlns:android="http://schemas.android.com/apk/res/android">

            function parseResources(xmlText) {
                Object.keys(RES).forEach(k => { RES[k] = {}; });
                if (!xmlText || !xmlText.trim()) return { ok: true, count: 0 };
                const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
                if (doc.querySelector('parsererror')) {
                    return { ok: false, error: doc.querySelector('parsererror').textContent.slice(0, 140) };
                }
                let count = 0;
                doc.querySelectorAll('colors > color').forEach(el => { RES.colors[el.getAttribute('name')] = el.textContent.trim(); count++; });
                doc.querySelectorAll('dimens > dimen').forEach(el => { RES.dimens[el.getAttribute('name')] = el.textContent.trim(); count++; });
                doc.querySelectorAll('strings > string').forEach(el => { RES.strings[el.getAttribute('name')] = el.textContent.trim(); count++; });
                doc.querySelectorAll('styles > style').forEach(styleEl => {
                    const name = styleEl.getAttribute('name');
                    const items = {};
                    styleEl.querySelectorAll('item').forEach(itemEl => { items[itemEl.getAttribute('name')] = itemEl.textContent.trim(); });
                    RES.styles[name] = items;
                    count++;
                });
                doc.querySelectorAll('drawables > shape').forEach(el => { RES.drawables[el.getAttribute('name')] = { type: 'shape', el }; count++; });
                doc.querySelectorAll('drawables > vector').forEach(el => { RES.drawables[el.getAttribute('name')] = { type: 'vector', el }; count++; });
                doc.querySelectorAll('menus > menu').forEach(el => { RES.menus[el.getAttribute('name')] = el; count++; });
                doc.querySelectorAll('layouts > layout').forEach(el => {
                    const name = el.getAttribute('name');
                    const child = Array.from(el.children)[0];
                    if (child) { RES.layouts[name] = child; count++; }
                });
                return { ok: true, count };
            }

            function resolveString(val) {
                if (!val) return val;
                if (val.startsWith('@string/')) {
                    const name = val.replace('@string/', '');
                    return RES.strings[name] !== undefined ? RES.strings[name] : '[' + name + ']';

                return val;

            const THEME_ATTR_COLORS = {

            const APP_ATTRS = [

                    if (options.length) {

                    });
                    if (options.length) {

                        };
                    }

            };

            // ─── COLOR / DIMEN / STRING / STYLE / DRAWABLE রেজলিউশন ──
            const NAMED_COLORS = {
                white: '#FFFFFF', black: '#000000', red: '#FF0000', green: '#00FF00',
                blue: '#0000FF', gray: '#888888', grey: '#888888', lightgray: '#D3D3D3',
                darkgray: '#444444', yellow: '#FFEB3B', transparent: 'transparent',
                cyan: '#00FFFF', magenta: '#FF00FF'
            };

            function resolveColor(val) {
                if (!val) return null;
                val = val.trim();
                if (val.startsWith('@color/')) {
                    const name = val.replace('@color/', '');
                    const custom = RES.colors[name];
                    return custom ? resolveColor(custom) || custom : '#e0e0e0';
                }
                if (val.startsWith('@android:color/')) {
                    const name = val.replace('@android:color/', '');
                    return ANDROID_SYSTEM_COLORS[name] || '#e0e0e0';
                }
                if (val.startsWith('?attr/') || val.startsWith('?')) {
                    const name = val.replace('?attr/', '').replace('?', '');
                    return THEME_ATTR_COLORS[name] || '#e0e0e0';
                }
                if (val.startsWith('@')) return '#e0e0e0';
                if (val.startsWith('#')) return val;
                if (NAMED_COLORS[val.toLowerCase()]) return NAMED_COLORS[val.toLowerCase()];
                return null;
            }

            // ─── ছবি/ভিডিও টেস্ট সাপোর্ট ─────────────────────
            // android:src বা android:background-এ সরাসরি http(s):// লিংক
            // দিলে সেই আসল ছবি/ভিডিও প্রিভিউতে দেখাবে। @drawable/xxx এখন
            // "📦 রিসোর্স" প্যানেলে সংজ্ঞায়িত shape/vector হলে রেজলভ হয়,
            // নাহলে placeholder box দেখায় (আসল drawable ফাইল ব্রাউজারে নেই)।
            function isImageUrl(val) {
                return !!val && /^https?:\/\//i.test(val.trim());
            }
            function applyImageBackground(el, url, scaleType) {
                el.style.backgroundImage = `url('${url}')`;
                el.style.backgroundPosition = 'center';
                el.style.backgroundRepeat = 'no-repeat';
                if (scaleType === 'fitXY') el.style.backgroundSize = '100% 100%';
                else if (scaleType === 'centerCrop' || !scaleType) el.style.backgroundSize = 'cover';
                else if (scaleType === 'fitCenter' || scaleType === 'centerInside') el.style.backgroundSize = 'contain';
                else el.style.backgroundSize = 'cover';
            }

            function toPx(val) {
                if (!val) return null;
                val = val.trim();
                if (val.startsWith('@dimen/')) {
                    const name = val.replace('@dimen/', '');
                    return RES.dimens[name] ? toPx(RES.dimens[name]) : null;
                }
                const m = val.match(/^(-?\d+(?:\.\d+)?)(dp|dip|sp|px)?$/);
                if (!m) return null;
                return parseFloat(m[1]) + 'px';
            }
            function toPxNum(val) {
                const p = toPx(val);
                return p ? parseFloat(p) : 0;
            }

            // style="..." (বা @style/...) থেকে একটা নির্দিষ্ট item-এর মান
            // খুঁজে বের করে — "📦 রিসোর্স" প্যানেলে সংজ্ঞায়িত কাস্টম
            // <style> ইনহেরিট করার জন্য এই একটাই সাধারণ ফাংশন ব্যবহার হয়।
            function resolveStyleItem(node, itemName) {
                const styleAttr = node.getAttribute('style');
                if (!styleAttr) return null;
                const s = RES.styles[styleAttr.replace('@style/', '').trim()];
                return s ? (s[itemName] || null) : null;
            }

            // shape/vector drawable রেন্ডার — "📦 রিসোর্স" প্যানেলে
            // সংজ্ঞায়িত <drawables> থেকে CSS বা inline SVG তৈরি করে।
            function applyDrawable(div, refVal) {
                if (!refVal || !refVal.startsWith('@drawable/')) return false;
                const name = refVal.replace('@drawable/', '');
                const d = RES.drawables[name];
                if (!d) return false;
                if (d.type === 'shape') {
                    const el = d.el;
                    const corners = el.querySelector('corners');
                    if (corners) {
                        const r = toPx(corners.getAttribute('radius') || corners.getAttribute('android:radius'));
                        if (r) div.style.borderRadius = r;
                    }
                    const solid = el.querySelector('solid');
                    if (solid) {
                        const c = resolveColor(solid.getAttribute('color') || solid.getAttribute('android:color'));
                        if (c) div.style.background = c;
                    }
                    const gradient = el.querySelector('gradient');
                    if (gradient) {
                        const s1 = resolveColor(gradient.getAttribute('startColor') || gradient.getAttribute('android:startColor'));
                        const s2 = resolveColor(gradient.getAttribute('endColor') || gradient.getAttribute('android:endColor'));
                        const angle = parseFloat(gradient.getAttribute('angle') || gradient.getAttribute('android:angle') || '0');
                        if (s1 && s2) div.style.background = `linear-gradient(${angle}deg, ${s1}, ${s2})`;
                    }
                    const stroke = el.querySelector('stroke');
                    if (stroke) {
                        const w = toPx(stroke.getAttribute('width') || stroke.getAttribute('android:width')) || '1px';
                        const c = resolveColor(stroke.getAttribute('color') || stroke.getAttribute('android:color')) || '#CAC4D0';
                        div.style.border = `${w} solid ${c}`;
                    }
                    return true;
                }
                if (d.type === 'vector') {
                    const el = d.el;
                    const vw = el.getAttribute('viewportWidth') || '24';
                    const vh = el.getAttribute('viewportHeight') || '24';
                    const w = toPx(el.getAttribute('width')) || '24px';
                    const h = toPx(el.getAttribute('height')) || '24px';
                    let paths = '';
                    el.querySelectorAll('path').forEach(p => {
                        const pd = p.getAttribute('pathData') || p.getAttribute('android:pathData') || '';
                        const fill = resolveColor(p.getAttribute('fillColor') || p.getAttribute('android:fillColor')) || '#000000';
                        paths += `<path d="${pd}" fill="${fill}"></path>`;
                    });
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vw} ${vh}" width="100%" height="100%">${paths}</svg>`;
                    div.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
                    div.style.backgroundSize = 'contain';
                    div.style.backgroundRepeat = 'no-repeat';
                    div.style.backgroundPosition = 'center';
                    div.style.width = w;
                    div.style.height = h;
                    return true;
                }
                return false;
            }

            function checkWarnings(el, tag) {
                const w = el.getAttribute('android:layout_width');
                const h = el.getAttribute('android:layout_height');
                if (!w) warnings.push(`<${tag}> এ android:layout_width দেওয়া হয়নি`);
                if (!h) warnings.push(`<${tag}> এ android:layout_height দেওয়া হয়নি`);
            }

            // ─── <merge>/<include> রেজলভ করে সন্তানদের appendচাইল্ড করে ──
            // GridLayout হলে সেল-পজিশন আর TableRow হলে table-cell display
            // বসিয়ে দেয়। এটাই সব containerTags-এর একমাত্র চাইল্ড-লুপ।
            function appendResolvedChildren(containerDiv, parentNode, parentTag) {
                let gridAutoIndex = 0;
                // Flow হেল্পার নিজের ভেতরে referenced ভিউগুলো clone করে
                // দেখায়, তাই সেগুলো এখানে (মূল জায়গায়) আবার দেখানো হবে
                // না — ডুপ্লিকেট এড়াতে আগে থেকেই skip-সেট বানানো হচ্ছে।
                const flowManagedIds = new Set();
                Array.from(parentNode.children).forEach(c => {
                    if (c.tagName.split('.').pop() === 'Flow') {
                        (c.getAttribute('app:constraint_referenced_ids') || '').split(',').forEach(s => {
                            const t = s.trim();
                            if (t) flowManagedIds.add(t);
                        });
                    }
                });
                Array.from(parentNode.children).forEach(child => {
                    const childTag = child.tagName.split('.').pop();
                    if (childTag === 'merge') {
                        appendResolvedChildren(containerDiv, child, parentTag);

                const layouts = root.querySelectorAll('[data-constraint-root="1"]');
                layouts.forEach(cl => {
                    const allChildren = Array.from(cl.children);
                    // idMap-এ সব সরাসরি চাইল্ড থাকে (শুধু constraint-attribute
                    // থাকা ভিউ না) — কারণ একটা প্লেইন (constraint-less) sibling-ও
                    // আরেকজনের অ্যাঙ্কর টার্গেট হতে পারে, আর Guideline/Barrier-ও
                    // রেফারেন্স হতে পারে।
                    const idMap = {};
                    allChildren.forEach(c => { if (c.dataset && c.dataset.aid) idMap[c.dataset.aid] = c; });
                    const clRect = cl.getBoundingClientRect();

                    // ১. Guideline আগে পজিশন করা হয় (অন্য ভিউ এদের রেফারেন্স
                    // করতে পারে), begin/end/percent থেকে সরাসরি হিসাব হয়।
                    allChildren.filter(c => c.dataset && c.dataset.guideline === '1').forEach(c => {
                        const isVertical = c.dataset.guideOrientation !== 'horizontal';
                        const axisSize = isVertical ? clRect.width : clRect.height;
                        let pos = 0;
                        if (c.dataset.guidePercent !== undefined) pos = parseFloat(c.dataset.guidePercent) * axisSize;
                        else if (c.dataset.guideBegin !== undefined) pos = parseFloat(c.dataset.guideBegin);
                        else if (c.dataset.guideEnd !== undefined) pos = axisSize - parseFloat(c.dataset.guideEnd);
                        if (isVertical) { c.style.left = pos + 'px'; c.style.top = '0'; c.style.height = '100%'; c.style.width = '0'; }
                        else { c.style.top = pos + 'px'; c.style.left = '0'; c.style.width = '100%'; c.style.height = '0'; }
                    });

                    function anchorY(ref, edge) {
                        if (ref === 'parent') return edge === 'top' ? 0 : clRect.height;
                        const t = idMap[ref];
                        if (!t) return null;
                        const r = t.getBoundingClientRect();
                        return (edge === 'top' ? r.top : r.bottom) - clRect.top;
                    }
                    function anchorX(ref, edge) {
                        const isRTL = currentDir === 'rtl';
                        if (ref === 'parent') {
                            const wantLeftEdge = isRTL ? (edge === 'end') : (edge === 'start');
                            return wantLeftEdge ? 0 : clRect.width;
                        }
                        const t = idMap[ref];
                        if (!t) return null;
                        const r = t.getBoundingClientRect();
                        const wantLeftEdge = isRTL ? (edge === 'end') : (edge === 'start');
                        return (wantLeftEdge ? r.left : r.right) - clRect.left;
                    }

                    // ২. স্বাভাবিক constraint চাইল্ড (Guideline/Barrier বাদে)
                    const children = allChildren.filter(c => c.dataset && c.dataset.constraintChild === '1' && c.dataset.guideline !== '1');
                    children.forEach(c => {
                        const rect = c.getBoundingClientRect();
                        const w2 = rect.width, h2 = rect.height;
                        const d = c.dataset;

                        let top = null, bottom = null;
                        if (d.ctTop) top = anchorY(d.ctTop, d.ctTopEdge) + (parseFloat(d.ctTopMargin) || 0);
                        if (d.ctBottom) bottom = anchorY(d.ctBottom, d.ctBottomEdge) - (parseFloat(d.ctBottomMargin) || 0);
                        let finalTop = null;
                        if (top !== null && bottom !== null) {
                            const bias = d.ctVBias !== undefined ? parseFloat(d.ctVBias) : 0.5;
                            finalTop = top + (bottom - top - h2) * bias;
                        } else if (top !== null) finalTop = top;
                        else if (bottom !== null) finalTop = bottom - h2;

                        let start = null, end = null;
                        if (d.ctStart) start = anchorX(d.ctStart, d.ctStartEdge) + (parseFloat(d.ctStartMargin) || 0);
                        if (d.ctEnd) end = anchorX(d.ctEnd, d.ctEndEdge) - (parseFloat(d.ctEndMargin) || 0);
                        let finalLeft = null;
                        if (start !== null && end !== null) {
                            const bias = d.ctHBias !== undefined ? parseFloat(d.ctHBias) : 0.5;
                            finalLeft = start + (end - start - w2) * bias;
                        } else if (start !== null) finalLeft = start;
                        else if (end !== null) finalLeft = end - w2;

                        if (finalTop !== null || finalLeft !== null) {
                            c.style.position = 'absolute';
                            c.style.margin = '0';
                            if (finalTop !== null) c.style.top = finalTop + 'px';
                            if (finalLeft !== null) c.style.left = finalLeft + 'px';
                        }
                    });

                    // ৩. Barrier — referenced ভিউগুলো ইতিমধ্যে পজিশন হয়ে
                    // যাওয়ার পর তাদের max/min edge থেকে হিসাব হয়। কোনো ভিউ
                    // যদি উল্টো এই Barrier-কে রেফারেন্স করে, সেটা এখনো এর
                    // আগের (ডিফল্ট ০) অবস্থান দেখবে — এটা এই সরলীকৃত
                    // সলভারের একটা সীমাবদ্ধতা।
                    allChildren.filter(c => c.dataset && c.dataset.barrier === '1').forEach(c => {
                        const dir = c.dataset.barrierDirection || 'bottom';
                        const refIds = (c.dataset.barrierRefs || '').split(',').map(s => s.trim()).filter(Boolean);
                        const rects = refIds.map(id => idMap[id]).filter(Boolean).map(el => el.getBoundingClientRect());
                        if (!rects.length) return;
                        let pos;
                        if (dir === 'bottom') pos = Math.max(...rects.map(r => r.bottom)) - clRect.top;
                        else if (dir === 'top') pos = Math.min(...rects.map(r => r.top)) - clRect.top;
                        else if (dir === 'end' || dir === 'right') pos = Math.max(...rects.map(r => r.right)) - clRect.left;
                        else pos = Math.min(...rects.map(r => r.left)) - clRect.left;
                        if (dir === 'top' || dir === 'bottom') { c.style.top = pos + 'px'; c.style.left = '0'; c.style.width = '100%'; c.style.height = '0'; }
                        else { c.style.left = pos + 'px'; c.style.top = '0'; c.style.height = '100%'; c.style.width = '0'; }
                    });
                });
            }

            // ── <objectAnimator>/<set>/<valueAnimator> রুট রিসোর্স হলে
            // একটা ছোট ডেমো বক্স অ্যানিমেট করে দেখানো হয়, যেহেতু এগুলো
            // সাধারণত কোড থেকে কল হয়, নিজে থেকে কোনো "লেআউট" রেন্ডার করে না।
            function renderAnimatorPreview(rootEl) {
                const rootTag = rootEl.tagName.split('.').pop();
                let entries = [];
                if (rootTag === 'set') {
                    entries = Array.from(rootEl.querySelectorAll('objectAnimator, animator'));
                } else {
                    entries = [rootEl];
                }
                let keyframesCss = '';
                let animList = [];
                entries.forEach((el, i) => {
                    const prop = el.getAttribute('android:propertyName') || 'alpha';
                    const from = el.getAttribute('android:valueFrom');
                    const to = el.getAttribute('android:valueTo') || '1';
                    const duration = parseInt(el.getAttribute('android:duration')) || 1000;
                    const name = 'avAnim' + i;
                    let fromCss = '', toCss = '';
                    if (prop === 'alpha') { fromCss = `opacity:${from || 0};`; toCss = `opacity:${to};`; }
                    else if (prop === 'translationX') { fromCss = `transform:translateX(${from || 0}px);`; toCss = `transform:translateX(${to}px);`; }
                    else if (prop === 'translationY') { fromCss = `transform:translateY(${from || 0}px);`; toCss = `transform:translateY(${to}px);`; }
                    else if (prop === 'scaleX' || prop === 'scaleY') { fromCss = `transform:scale(${from || 1});`; toCss = `transform:scale(${to});`; }
                    else if (prop === 'rotation') { fromCss = `transform:rotate(${from || 0}deg);`; toCss = `transform:rotate(${to}deg);`; }
                    keyframesCss += `@keyframes ${name} { from { ${fromCss} } to { ${toCss} } }\n`;
                    animList.push(`${name} ${duration}ms ease-in-out infinite alternate`);
                });
                let styleTag = document.getElementById('avAnimatorKeyframes');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'avAnimatorKeyframes';
                    document.head.appendChild(styleTag);
                }
                styleTag.textContent = keyframesCss;
                previewRoot.innerHTML = `
                    <div style="padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;">
                        <div style="font-size:12px;color:#888;">🎞️ Animator রিসোর্স প্রিভিউ (ডেমো বক্স)</div>
                        <div style="width:70px;height:70px;background:#6750A4;border-radius:16px;animation:${animList.join(', ')};"></div>
                        <div style="font-size:10px;color:#aaa;text-align:center;">${entries.length}টি property অ্যানিমেট হচ্ছে — এটা শুধুই একটা ডেমো ভিজুয়ালাইজেশন, real View-তে সরাসরি প্রয়োগ হয় না।</div>
                    </div>`;
                setStatus(true, 'Animator প্রিভিউ');
                warnList.classList.remove('visible');
                updateEditorInfo();
            }

            function render() {
                clearTimeout(renderTimer);
                renderTimer = setTimeout(doRender, 150);
            }

            function doRender() {
                const xmlText = getVal();
                warnings = [];

                if (!xmlText.trim()) {
                    previewRoot.innerHTML = `<div class="empty-state"><span class="icon">📄</span><span>এখানে XML লিখলে প্রিভিউ দেখাবে</span><span style="font-size:11px;color:#888;">স্যাম্পল সিলেক্ট করে শুরু করুন</span></div>`;
                    setStatus(true, 'ফাঁকা');
                    warnList.classList.remove('visible');
                    warnList.innerHTML = '';
                    updateEditorInfo();
                    return;
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'application/xml');
                const parseError = doc.querySelector('parsererror');

                if (parseError) {
                    const errMsg = parseError.textContent || 'XML পার্সিং এরর';
                    setStatus(false, errMsg);
                    errorDetail.textContent = errMsg;
                    errorDetail.classList.add('visible');
                    warnList.classList.remove('visible');
                    previewRoot.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><span>XML এ এরর আছে</span><span style="font-size:11px;color:#ff9caf;">${errMsg.slice(0, 120)}</span></div>`;
                    updateEditorInfo();
                    return;
                }

                errorDetail.classList.remove('visible');

                const rootTagName = doc.documentElement.tagName.split('.').pop();
                if (['objectAnimator', 'set', 'valueAnimator', 'animator'].includes(rootTagName)) {
                    try { renderAnimatorPreview(doc.documentElement); } catch (e) { /* ignore, fall through */ }
                    return;
                }

                try {
                    // <layout> হলো Data Binding-এর রুট র‍্যাপার — এর <data>
                    // ব্লক আসল UI না, তাই বাদ দিয়ে ভেতরের real layout root
                    // (প্রথম non-<data> চাইল্ড) দিয়ে বিল্ড করা হয়।
                    let effectiveRoot = doc.documentElement;
                    if (rootTagName === 'layout') {
                        const realRoot = Array.from(effectiveRoot.children).find(c => c.tagName.split('.').pop() !== 'data');
                        if (realRoot) effectiveRoot = realRoot;
                    }

                    const rootEl = buildNode(effectiveRoot);
                    previewRoot.innerHTML = '';
                    if (rootEl) {
                        rootEl.style.width = '100%';
                        rootEl.style.minHeight = '480px';
                        rootEl.style.padding = '4px';
                        previewRoot.appendChild(rootEl);
                        // ConstraintLayout পজিশনিং এখন করা হয় — rootEl আসল
                        // DOM-এ যুক্ত হয়ে গেছে, তাই getBoundingClientRect
                        // এখন সঠিক পিক্সেল মান দেবে।
                        resolveConstraintLayouts(previewRoot);
                    }
                    setStatus(true, warnings.length > 0 ? `${warnings.length}টি সতর্কতা` : 'ঠিক আছে');
                } catch (e) {
                    setStatus(false, e.message || 'রেন্ডারিং এরর');
                    errorDetail.textContent = e.message || 'অজানা এরর';
                    errorDetail.classList.add('visible');
                    previewRoot.innerHTML = `<div class="empty-state"><span class="icon">🔥</span><span>রেন্ডারিং এরর</span><span style="font-size:11px;color:#ff9caf;">${(e.message || '').slice(0, 120)}</span></div>`;
                    updateEditorInfo();
                    return;
                }

                if (warnings.length > 0) {
                    warnList.innerHTML = '';
                    warnings.slice(0, 8).forEach(w => {
                        const d = document.createElement('div');
                        d.className = 'warn-item';
                        d.textContent = '⚠ ' + w;
                        warnList.appendChild(d);
                    });
                    warnList.classList.add('visible');
                } else {
                    warnList.classList.remove('visible');
                    warnList.innerHTML = '';
                }

                updateEditorInfo();
                updatePreviewInfo();
            }

            function setStatus(ok, message) {
                const icon = statusBar.querySelector('.status-icon');
                const msg = statusBar.querySelector('.status-msg');
                const meta = statusBar.querySelector('.status-meta');
                if (ok) {
                    statusBar.className = 'status-bar ok';
                    icon.textContent = '✓';
                    msg.textContent = message || 'প্রস্তুত';
                    meta.textContent = `XML · ${getVal().trim().length} অক্ষর`;
                } else {
                    statusBar.className = 'status-bar error';
                    icon.textContent = '✗';
                    msg.textContent = 'এরর';
                    meta.textContent = message ? message.slice(0, 60) : 'পার্সিং এরর';
                }
            }

            function updateEditorInfo() {
                const lines = getVal().split('\n').length;
                const chars = getVal().length;
                editorInfo.textContent = `লাইন ${lines} · ${chars} অক্ষর`;
            }

            function updatePreviewInfo() {
                const hasContent = previewRoot.querySelector('.empty-state') === null;
                previewInfo.textContent = hasContent ? '✅ রেন্ডার হয়েছে' : '⏳ ফাঁকা';
            }

            // ─── ফরম্যাটার — প্রফেশনাল লাইন-বাই-লাইন ইনডেন্ট ──
            function formatXML(xml) {
                try {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(xml, 'application/xml');
                    if (doc.querySelector('parsererror')) return xml;

                    const serializer = new XMLSerializer();
                    const raw = serializer.serializeToString(doc);

                    const tokens = raw.match(/<[^>]+>|[^<]+/g) || [];
                    let indent = 0;
                    let out = '';
                    tokens.forEach(tok => {
                        tok = tok.trim();
                        if (!tok) return;
                        const isClosing = /^<\//.test(tok);
                        const isSelfClose = /\/>$/.test(tok);
                        const isOpening = /^<[^\/!?]/.test(tok) && !isSelfClose;

                        if (isClosing) indent = Math.max(0, indent - 1);
                        out += '    '.repeat(indent) + tok + '\n';
                        if (isOpening) indent++;
                    });
                    return out.trim();
                } catch (e) { return xml; }
            }

            function formatAndRender() {
                const formatted = formatXML(getVal());
                if (formatted !== getVal()) {
                    setVal(formatted);
                    render();
                } else {
                    render();
                }
                editor.focus();
            }

            function initResize() {
                // Pointer Events (mouse+touch+pen একসাথে হ্যান্ডল করে) এবং
                // setPointerCapture ব্যবহার করছি যাতে ডেক্সটপ-মোড মোবাইল
                // ব্রাউজারেও ড্র্যাগ করার সময় কো-অর্ডিনেট মিসম্যাচ না হয়
                // এবং হ্যান্ডেল ছেড়ে দিলেও move ইভেন্ট হারিয়ে না যায়।
                function onPointerDown(e) {
                    resizeActive = true;
                    resizeHandle.classList.add('active');
                    try { resizeHandle.setPointerCapture(e.pointerId); } catch (err) {}

                    const isVertical = window.matchMedia('(max-width: 899px)').matches;
                    const startX = e.clientX;
                    const startY = e.clientY;
                    const startWidth = editorPane.getBoundingClientRect().width;
                    const startHeight = editorPane.getBoundingClientRect().height;

                    function onMove(ev) {
                        if (!resizeActive) return;
                        const containerRect = workspace.getBoundingClientRect();
                        // হ্যান্ডেলের নিজের পুরুত্ব (৬px) বাদে বাকি পুরো
                        // জায়গা একটা পাশকে দেওয়া যাবে — তাই টেনে প্রায়
                        // সম্পূর্ণ ফুলস্ক্রিন (অন্য পাশ প্রায় 0) করা যায়,
                        // আগে যেমন কমপক্ষে ৮০-১২০px আটকে থাকত তেমন না।
                        if (isVertical) {
                            const delta = ev.clientY - startY;
                            let newHeight = startHeight + delta;
                            const minH = 0;
                            const maxH = Math.max(minH, containerRect.height - 6);
                            newHeight = Math.min(Math.max(newHeight, minH), maxH);
                            editorPane.style.flex = '0 0 auto';
                            editorPane.style.width = '';
                            editorPane.style.height = newHeight + 'px';
                            previewPane.style.flex = '1 1 auto';
                        } else {
                            const delta = ev.clientX - startX;
                            let newWidth = startWidth + delta;
                            const minW = 0;
                            const maxW = Math.max(minW, containerRect.width - 6);
                            newWidth = Math.min(Math.max(newWidth, minW), maxW);
                            editorPane.style.flex = '0 0 auto';
                            editorPane.style.height = '';
                            editorPane.style.width = newWidth + 'px';
                            previewPane.style.flex = '1 1 auto';
                        }
                        render();
                        ev.preventDefault();
                    }
                    function onUp(ev) {
                        resizeActive = false;
                        resizeHandle.classList.remove('active');
                        try { resizeHandle.releasePointerCapture(ev.pointerId); } catch (err) {}
                        resizeHandle.removeEventListener('pointermove', onMove);
                        resizeHandle.removeEventListener('pointerup', onUp);
                        resizeHandle.removeEventListener('pointercancel', onUp);
                    }
                    resizeHandle.addEventListener('pointermove', onMove);
                    resizeHandle.addEventListener('pointerup', onUp);
                    resizeHandle.addEventListener('pointercancel', onUp);
                    e.preventDefault();
                }
                function onDblClick() {
                    // ডাবল-ক্লিকে ৫০/৫০ এ রিসেট
                    editorPane.style.flex = '1';
                    editorPane.style.width = '';
                    editorPane.style.height = '';
                    previewPane.style.flex = '1';
                    render();
                }
                resizeHandle.addEventListener('pointerdown', onPointerDown);
                resizeHandle.addEventListener('dblclick', onDblClick);
            }

            function toggleFullscreen() {
                workspace.classList.toggle('fullscreen');
                fullscreenToggle.textContent = '⛶';
                setTimeout(() => { render(); }, 100);
            }

            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.shiftKey && e.key === 'F') {
                    e.preventDefault();
                    formatAndRender();
                    return;
                }
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    downloadXML();
                    return;
                }
                if (e.key === 'F11') {
                    e.preventDefault();
                    toggleFullscreen();
                }
            });

            function copyXML() {
                const text = getVal();
                if (!text.trim()) return;
                navigator.clipboard.writeText(text).then(() => {
                    const msg = statusBar.querySelector('.status-msg');
                    msg.textContent = '✅ কপি করা হয়েছে!';
                    setTimeout(() => { msg.textContent = 'প্রস্তুত'; }, 1200);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    statusBar.querySelector('.status-msg').textContent = '✅ কপি করা হয়েছে!';
                    setTimeout(() => { statusBar.querySelector('.status-msg').textContent = 'প্রস্তুত'; }, 1200);
                });
            }

            function downloadXML() {
                const text = getVal();
                if (!text.trim()) return;
                const blob = new Blob([text], { type: 'application/xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'layout.xml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ─── আলাদা উইন্ডোতে লাইভ প্রিভিউ রান ──────────────
            function openPopoutPreview() {
                const w = window.open('', '_blank', 'width=440,height=780');
                if (!w) {
                    alert('পপআপ ব্লক করা আছে — ব্রাউজার সেটিংসে পপআপ অনুমতি দিন।');
                    return;
                }
                const deviceW = deviceSelect.value + 'px';
                w.document.open();
                w.document.write(`<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>XML Live Preview — Popout</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 10%, #1a1f3a, #05060a 80%);
        display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px;
        font-family: 'Inter', system-ui, sans-serif;
    }
    .frame {
        width: ${deviceW}; max-width: 100%; background: #05060a; border-radius: 28px; padding: 8px;
        box-shadow: 0 12px 40px rgba(0,0,0,.7);
    }
    .statusbar {
        height: 20px; background: #000; border-radius: 14px 14px 0 0; display: flex; align-items: center;
        justify-content: space-between; padding: 0 14px; font-size: 9px; color: #8fffb0;
        font-family: monospace; font-weight: 500;
    }
    #root { background: #fff; color: #1a1a1a; min-height: 640px; border-radius: 0 0 14px 14px; overflow: auto; }
    .reload-hint {
        position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: #6a7199; font-family: sans-serif;
    }
</style></head>
<body>
    <div class="frame">
        <div class="statusbar"><span>9:41</span><span>●●●</span></div>
        <div id="root">${previewRoot.innerHTML}</div>
    </div>
    <div class="reload-hint">মূল ট্যাব থেকে "নতুন উইন্ডো" বাটনে চাপলে এখানে সবশেষ প্রিভিউ আপডেট হবে</div>
</body></html>`);
                w.document.close();
            }

            // ─── SAMPLE LOAD ─────────────────────────────────
            sampleSelect.addEventListener('change', () => {
                const v = sampleSelect.value;
                if (v && SAMPLES[v]) {
                    setVal(SAMPLES[v]);
                    render();
                }
                sampleSelect.value = '';
            });

            clearBtn.addEventListener('click', () => {
                setVal('');
                render();
                editor.focus();
            });

            formatBtn.addEventListener('click', formatAndRender);
            copyBtn.addEventListener('click', copyXML);
            downloadBtn.addEventListener('click', downloadXML);
            popoutBtn.addEventListener('click', openPopoutPreview);
            fullscreenToggle.addEventListener('click', toggleFullscreen);

            editor.on('change', () => {
                render();
                updateEditorInfo();
            });

            // ─── ডিভাইস সাইজ পরিবর্তন ──────────────────────────
            deviceSelect.addEventListener('change', () => {
                phoneFrame.style.width = deviceSelect.value + 'px';
            });

            zoomSelect.addEventListener('change', () => {
                const scale = parseFloat(zoomSelect.value);
                phoneFrame.style.transform = `scale(${scale})`;
                phoneFrame.style.transformOrigin = 'top center';
            });

            // ─── RTL/LTR ডিরেকশন টগল ───────────────────────────
            dirSelect.addEventListener('change', () => {
                currentDir = dirSelect.value;
                previewRoot.style.direction = currentDir;
                render();
            });

            // ─── প্রজেক্ট রিসোর্স প্যানেল (📦) ──────────────────
            resBtn.addEventListener('click', () => {
                resInput.value = resInput.value || DEFAULT_RES;
                resOverlay.classList.add('visible');
            });
            resCloseBtn.addEventListener('click', () => {
                resOverlay.classList.remove('visible');
            });
            resOverlay.addEventListener('click', (e) => {
                if (e.target === resOverlay) resOverlay.classList.remove('visible');
            });
            function applyResources() {
                const result = parseResources(resInput.value);
                if (result.ok) {
                    resStatus.textContent = `✓ ${result.count}টি রিসোর্স লোড হয়েছে`;
                    resStatus.className = 'res-status ok';
                    render();
                } else {
                    resStatus.textContent = '✗ ' + result.error;
                    resStatus.className = 'res-status err';
                }
            }
            resApplyBtn.addEventListener('click', applyResources);

            // ─── INIT ────────────────────────────────────────
            resInput.value = DEFAULT_RES;
            parseResources(DEFAULT_RES);
            setVal(SAMPLES.linear);
            render();
            editor.focus();
            initResize();

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => { render(); }, 200);
            });

            window.__render = render;
            window.__format = formatXML;
            window.__editor = editor;

            // ═══════════════════════════════════════════════
            // PWA: "Add to Home Screen" ইনস্টল বাটন + সার্ভিস ওয়ার্কার
            // ═══════════════════════════════════════════════
            let deferredPrompt = null;
            const installBtn = document.getElementById('installBtn');
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                if (installBtn) installBtn.style.display = 'inline-flex';
            });
            if (installBtn) {
                installBtn.addEventListener('click', async () => {
                    if (!deferredPrompt) return;
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                });
            }
            window.addEventListener('appinstalled', () => {
                if (installBtn) installBtn.style.display = 'none';
            });
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => {});
                });
            }

            // ═══════════════════════════════════════════════
            // হালকা "সোর্স দেখা কঠিন করা" — এগুলো ডিটারেন্ট মাত্র,
            // ১০০% সুরক্ষা নয়। ব্রাউজারের ডেভটুলস/নেটওয়ার্ক ট্যাব
            // দিয়ে দেখতে চাইলে যেকোনো টেকনিক্যাল ব্যবহারকারী তা এড়িয়ে
            // যেতে পারবেন — client-side কোড কখনোই সম্পূর্ণ লুকানো যায় না।
            // ═══════════════════════════════════════════════
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            document.addEventListener('keydown', (e) => {
                const k = e.key;
                if (k === 'F12') e.preventDefault();
                if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) e.preventDefault();
                if (e.ctrlKey && (k === 'U' || k === 'u')) e.preventDefault();
            });

        })();
    </script>
</body>
</html>
